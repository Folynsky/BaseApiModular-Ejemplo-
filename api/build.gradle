plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.springbootModularApi'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

// Define a custom configuration for the Mockito agent JAR
configurations {
    mockitoAgent {
        // --- ADD THIS LINE ---
        transitive = false // Ensure only the directly specified JAR is resolved, not its dependencies
        // --- END ADD ---
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Critical: Add mockito-core to the custom agent configuration
    mockitoAgent 'org.mockito:mockito-core:5.12.0' // Use the same version as your Spring Boot Test pulls in for consistency

    implementation project(':service')
    implementation project(':common')
}

// --- Configuración para TODAS las tareas de prueba (Test) ---
// With the Java Agent, we should REMOVE the --add-opens jvmArgs.
tasks.withType(Test) {
    useJUnitPlatform()

    // Ensure jvmArgs are NOT present here (remove or comment out the block)
    // jvmArgs(...)

    // Add the Java Agent JVM Arg
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"

    doFirst {
        println "JVM Arguments for test task: ${jvmArgs.join(' ')}"
    }
}

bootJar {
    // Spring Boot now detects the main class automatically.
}