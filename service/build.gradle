// service/build.gradle
plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.springbootModularApi'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Para Spring Data JPA

    // --- CAMBIO CLAVE: Usa el driver de PostgreSQL ---
    runtimeOnly 'org.postgresql:postgresql' // Driver de PostgreSQL
    // --- FIN CAMBIO CLAVE ---

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}